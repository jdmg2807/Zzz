name: Build VoxelForge APK

# Solo se compila el modelador (módulo `modeler`). El juego (módulo `app`) se dio por terminado
# y ya no forma parte de esta cadena de compilación ni de los releases.
on:
  push:
    branches: [ "**" ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Compilar VoxelForge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK/cmdline-tools/latest" ]; then
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/clt.zip
            unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 | tail -5
          ls "$SDK/platforms"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Pruebas unitarias (JVM)
        run: |
          set -o pipefail
          gradle :modeler:testDebugUnitTest \
            --no-daemon --stacktrace --console=plain 2>&1 | tee test.log

      - name: Compilar APK
        run: |
          set -o pipefail
          gradle :modeler:assembleDebug :modeler:assembleRelease \
            --no-daemon --stacktrace --console=plain 2>&1 | tee build.log

      - name: Resumen de la compilación
        if: always()
        run: |
          {
            echo "## Resultado"
            echo ""
            echo "- Gradle: ${{ job.status }}"
            if ls modeler/build/outputs/apk/release/*.apk >/dev/null 2>&1; then
              echo "- APK release: $(ls -lh modeler/build/outputs/apk/release/*.apk | awk '{print $5, $9}')"
            fi
            if [ -f test.log ]; then
              echo ""
              echo "### Pruebas unitarias"
              echo '```'
              grep -E "tests completed|FAILED|PASSED|BUILD (SUCCESSFUL|FAILED)" test.log | tail -20 || true
              echo '```'
            fi
            if ls modeler/build/test-results/testDebugUnitTest/*.xml >/dev/null 2>&1; then
              echo ""
              echo "### Resumen de pruebas"
              echo '```'
              grep -h -o 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' \
                modeler/build/test-results/testDebugUnitTest/*.xml | awk -F'"' \
                '{t+=$2; s+=$4; f+=$6; e+=$8} END {printf "tests=%d skipped=%d failures=%d errors=%d\n", t, s, f, e}'
              echo '```'
            fi
            if [ -f build.log ]; then
              echo ""
              echo "<details><summary>Últimas líneas del log</summary>"
              echo ""
              echo '```'
              tail -n 160 build.log
              echo '```'
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar log en un issue (diagnóstico)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Run ${{ github.run_id }} · commit ${{ github.sha }}"
            echo ""
            echo "### Errores / avisos"
            echo '```'
            cat test.log build.log 2>/dev/null \
              | grep -E "^(e: |FAILURE|What went wrong|> Task .*FAILED|Execution failed|Caused by|.*AssertionError|.*expected:)" \
              | head -120 || true
            echo '```'
            echo ""
            echo "### Inicio del log"
            echo '```'
            head -n 80 build.log 2>/dev/null || echo "sin build.log"
            echo '```'
          } > /tmp/ci.md
          NUMBER=$(gh issue list --state open --search "CI build log in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --body-file /tmp/ci.md
          else
            gh issue create --title "CI build log (auto)" --body-file /tmp/ci.md
          fi

      - name: Anotar errores de compilación
        if: failure()
        run: |
          echo "Errores detectados:"
          # Se anotan los errores del compilador y de las pruebas: las anotaciones del check-run
          # son lo único legible sin descargar el log completo.
          for LOG in test.log build.log; do
            [ -f "$LOG" ] || continue
            echo "--- $LOG"
            grep -E "^e: " "$LOG" | awk '!seen[$0]++' | head -50 > /tmp/errors.txt || true
            wc -l /tmp/errors.txt
            head -10 /tmp/errors.txt | while IFS= read -r line; do echo "::error::$line"; done
          done

      - name: Anotar errores (1)
        if: failure()
        run: |
          [ -f /tmp/errors.txt ] || exit 0
          sed -n '1,10p' /tmp/errors.txt | while IFS= read -r line; do echo "::error::$line"; done

      - name: Anotar errores (2)
        if: failure()
        run: |
          [ -f /tmp/errors.txt ] || exit 0
          sed -n '11,20p' /tmp/errors.txt | while IFS= read -r line; do echo "::error::$line"; done

      - name: Anotar errores (3)
        if: failure()
        run: |
          [ -f /tmp/errors.txt ] || exit 0
          sed -n '21,30p' /tmp/errors.txt | while IFS= read -r line; do echo "::error::$line"; done

      - name: Anotar errores (4)
        if: failure()
        run: |
          [ -f /tmp/errors.txt ] || exit 0
          sed -n '31,40p' /tmp/errors.txt | while IFS= read -r line; do echo "::error::$line"; done

      - name: Anotar errores (5)
        if: failure()
        run: |
          [ -f /tmp/errors.txt ] || exit 0
          sed -n '41,50p' /tmp/errors.txt | while IFS= read -r line; do echo "::error::$line"; done

      - name: Anotar fallos de pruebas
        if: failure()
        run: |
          python3 - <<'PY' > /tmp/fails.txt
          import glob
          import xml.etree.ElementTree as ET
          msgs = []
          for f in glob.glob("modeler/build/test-results/testDebugUnitTest/*.xml"):
              for tc in ET.parse(f).getroot().iter("testcase"):
                  for fail in tc.findall("failure") + tc.findall("error"):
                      msg = (fail.get("message") or "").split("\n")[0][:240]
                      msgs.append(f"{tc.get('classname').split('.')[-1]}.{tc.get('name')}: {msg}")
          for m in msgs:
              print(m)
          PY
          echo "fallos: $(wc -l < /tmp/fails.txt)"

      - name: Anotar fallos (1)
        if: failure()
        run: |
          [ -f /tmp/fails.txt ] || exit 0
          sed -n '1,10p' /tmp/fails.txt | while IFS= read -r line; do echo "::error::$line"; done

      - name: Anotar fallos (2)
        if: failure()
        run: |
          [ -f /tmp/fails.txt ] || exit 0
          sed -n '11,20p' /tmp/fails.txt | while IFS= read -r line; do echo "::error::$line"; done

      - name: Anotar fallos (3)
        if: failure()
        run: |
          [ -f /tmp/fails.txt ] || exit 0
          sed -n '21,30p' /tmp/fails.txt | while IFS= read -r line; do echo "::error::$line"; done

      - name: Anotar fallos (4)
        if: failure()
        run: |
          [ -f /tmp/fails.txt ] || exit 0
          sed -n '31,40p' /tmp/fails.txt | while IFS= read -r line; do echo "::error::$line"; done

      - name: Anotar fallos (5)
        if: failure()
        run: |
          [ -f /tmp/fails.txt ] || exit 0
          sed -n '41,50p' /tmp/fails.txt | while IFS= read -r line; do echo "::error::$line"; done

      - name: Reunir el APK
        if: success()
        run: |
          mkdir -p dist
          # Un único APK, tal cual: sin zip, sin el APK del juego.
          cp modeler/build/outputs/apk/release/*.apk "dist/VoxelForge-${GITHUB_RUN_NUMBER}.apk"
          ls -lh dist

      - name: Verificar firma y tamaño
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner 2>/dev/null | tail -1)
          {
            echo "Run ${{ github.run_id }} · commit ${{ github.sha }}"
            echo ""
            echo "### APK"
            ls -l dist/*.apk | awk '{printf "- %s: %d bytes (%.1f MB)\n", $9, $5, $5/1048576}'
            echo ""
            echo "### Certificado de firma"
            echo '```'
            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" verify --print-certs dist/*.apk | head -5
            else
              echo "apksigner no encontrado"
            fi
            echo '```'
          } > /tmp/sign.md
          gh issue comment 1 --body-file /tmp/sign.md || true

      - name: Subir APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VoxelForge-APK
          path: dist/VoxelForge-*.apk
          if-no-files-found: error

      - name: Publicar en GitHub Releases (solo tags)
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VoxelForge-*.apk
          generate_release_notes: true
