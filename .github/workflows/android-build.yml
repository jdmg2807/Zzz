name: Build Android APK

on:
  push:
    branches: [ "**" ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK/cmdline-tools/latest" ]; then
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/clt.zip
            unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 | tail -5
          ls "$SDK/platforms"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Compilar APK y mod de ejemplo
        run: |
          set -o pipefail
          gradle :app:assembleDebug :app:assembleRelease :examplemod:jar \
            --no-daemon --stacktrace --console=plain 2>&1 | tee build.log

      - name: Resumen de la compilación
        if: always()
        run: |
          {
            echo "## Resultado"
            echo ""
            echo "- Gradle: ${{ job.status }}"
            if ls app/build/outputs/apk/release/*.apk >/dev/null 2>&1; then
              echo "- APK release: $(ls -lh app/build/outputs/apk/release/*.apk | awk '{print $5, $9}')"
            fi
            if [ -f build.log ]; then
              echo ""
              echo "<details><summary>Últimas líneas del log</summary>"
              echo ""
              echo '```'
              tail -n 160 build.log
              echo '```'
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reunir artefactos
        if: success()
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/VoxelCraft-${GITHUB_RUN_NUMBER}-release.apk"
          cp app/build/outputs/apk/debug/*.apk "dist/VoxelCraft-${GITHUB_RUN_NUMBER}-debug.apk"
          cp examplemod/build/libs/examplemod.jar dist/examplemod.jar
          ls -lh dist

      - name: Subir APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VoxelCraft-APK
          path: dist/*
          if-no-files-found: error

      - name: Publicar en GitHub Releases (solo tags)
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
