name: Build Android APK

on:
  push:
    branches: [ "**" ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Compilar APK y mod de ejemplo
        run: |
          gradle :app:assembleDebug :app:assembleRelease :examplemod:jar --no-daemon --stacktrace

      - name: Reunir artefactos
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/VoxelCraft-${GITHUB_RUN_NUMBER}-release.apk"
          cp app/build/outputs/apk/debug/*.apk "dist/VoxelCraft-${GITHUB_RUN_NUMBER}-debug.apk"
          cp examplemod/build/libs/examplemod.jar dist/examplemod.jar
          ls -lh dist

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: VoxelCraft-APK
          path: dist/*
          if-no-files-found: error

      - name: Publicar en GitHub Releases (solo tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
