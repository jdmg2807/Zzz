name: Crear keystore de firma

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generar keystore
        run: |
          mkdir -p out
          keytool -genkeypair -v \
            -keystore out/voxelcraft.jks \
            -alias voxelcraft \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass voxelcraft -keypass voxelcraft \
            -dname "CN=VoxelCraft, OU=Arena, O=VoxelCraft, L=Asuncion, C=PY"
      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: out/voxelcraft.jks
